<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
</head>

<body class="bg-gray-100 h-screen flex justify-center items-center">
    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold text-center mb-6">Login</h1>
        <form id="loginForm">
            <div class="mb-4">
                <label for="login" class="block text-gray-700">Логин</label>
                <input type="text" id="login" name="login" class="w-full p-2 border border-gray-300 rounded-md"
                    required />
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700">Пароль</label>
                <input type="password" id="password" name="password"
                    class="w-full p-2 border border-gray-300 rounded-md" required />
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md">Войти</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const login = document.getElementById('login').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('https://airy-enjoyment-production-16a0.up.railway.app/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ login, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    alert(data.message || 'Ошибка входа');
                    return;
                }

                // Сохраняем логин и пароль в localStorage (или только login, если не нужно сравнивать пароль позже)
                localStorage.setItem('adminLogin', login);
                localStorage.setItem('adminPass', password);

                window.location.href = 'index.html';
            } catch (err) {
                console.error(err);
                alert('Ошибка входа');
            }
        });
    </script>
</body>

</html>
